# ── CRISP AND CLOUD ──────────────────────────────────────────────
# Render blueprint (https://render.com/docs/blueprint).
#
# ONE web service = the WhatsApp bridge (Baileys) AND the customer-facing
# static PWA (index.html + manifest.json + logo.png + images). Render starts
# `npm start` -> `node server/index.js`, which originally listens on PORT and
# has /api/* + the SPA wired in the same process.
#
# Replaces NODE 3000 with the port Render allocates.
#
# How to deploy (one-click):
#   1. Push this folder to a GitHub repo.
#   2. https://dashboard.render.com/new-redirect?type=git&repo=<your-repo>
#   3. Add the following env vars under the service:
#        WA_OWNER_NUMBER       9058767686   (owner number, incl. country code)
#        WA_API_KEY            (optional)   shared secret for /api/* auth
#        WA_SESSION_DIR        /var/run/crisp-and-cloud-whatsapp
#        WA_LOG_LEVEL          info
#   4. Render auto-deploys. After deploy, open Settings -> Disks and add a
#      256MB persistent disk named WA_SESSION_DIR to keep the WhatsApp linked
#      device credentials across restarts.
#   5. Scan the pairing QR from the Admin -> WhatsApp Alerts screen.

services:
  - type: web
    name: crisp-and-cloud-whatsapp
    runtime: node
    region: oregon
    plan: starter
    build:
      command: npm install
    start:
      command: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        description: Render-assigned port (3000 is a safe default)
        value: 3000
      - key: WA_OWNER_NUMBER
        description: Owner number including country code, e.g. 919058767686
        sync: false
      - key: WA_API_KEY
        description: Shared secret; set to require `x-api-key` on /api calls
        sync: false
    disks:
      - name: wa-session
        mountPath: /var/run/crisp-and-cloud-whatsapp
        sizeGB: 256
